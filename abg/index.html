  <!-- Flutter's compiled app sets document.title to "ABG Prototype" after boot.
       This repo cannot rebuild main.dart.js; keep the public title in place. -->
  <script>
    (function () {
      var TITLE = "ABG: The Acid-Base Learning App — Salt Shaker Studio";
      function keepTitle() {
        if (document.title !== TITLE) document.title = TITLE;
      }
      keepTitle();
      var titleEl = document.querySelector("title");
      if (titleEl && window.MutationObserver) {
        new MutationObserver(keepTitle).observe(titleEl, {childList: true, characterData: true, subtree: true});
      }
      window.addEventListener("load", keepTitle);
      setTimeout(keepTitle, 500);
      setTimeout(keepTitle, 2000);
    })();
  </script>
